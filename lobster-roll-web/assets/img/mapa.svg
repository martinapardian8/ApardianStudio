<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" width="640" height="440" role="img" aria-labelledby="mapaTitulo">
  <title id="mapaTitulo">Mapa esquemático: Carrer de Muntaner 22, entre Gran Via y Diputació, cerca del metro Universitat</title>
  <rect width="640" height="440" fill="#ece2d1"/>
  <g transform="rotate(-8 320 220)">
    <g stroke="#fffaf2" stroke-linecap="round">
      <line x1="-60" y1="120" x2="720" y2="120" stroke-width="18"/>
      <line x1="-60" y1="230" x2="720" y2="230" stroke-width="30"/>
      <line x1="-60" y1="340" x2="720" y2="340" stroke-width="18"/>
      <line x1="90" y1="-40" x2="90" y2="480" stroke-width="16"/>
      <line x1="210" y1="-40" x2="210" y2="480" stroke-width="16"/>
      <line x1="330" y1="-40" x2="330" y2="480" stroke-width="16"/>
      <line x1="450" y1="-40" x2="450" y2="480" stroke-width="16"/>
      <line x1="570" y1="-40" x2="570" y2="480" stroke-width="22"/>
    </g>
    <circle cx="600" cy="230" r="46" fill="#fffaf2"/>
    <g font-family="Oswald, 'Arial Narrow', Arial, sans-serif" font-size="13" letter-spacing="1.5" fill="#1b211c" opacity=".75" text-transform="uppercase">
      <text x="120" y="112">DIPUTACIÓ</text>
      <text x="120" y="216">GRAN VIA DE LES CORTS CATALANES</text>
      <text x="120" y="332">SEPÚLVEDA</text>
      <text transform="translate(82 60) rotate(90)">CASANOVA</text>
      <text transform="translate(202 60) rotate(90)">MUNTANER</text>
      <text transform="translate(322 60) rotate(90)">ARIBAU</text>
      <text transform="translate(442 60) rotate(90)">ENRIC GRANADOS</text>
      <text transform="translate(565 -30) rotate(90)">BALMES</text>
      <text x="560" y="300" font-size="12">PL. UNIVERSITAT</text>
    </g>
    <!-- parking -->
    <g transform="translate(300 120)"><rect x="-13" y="-13" width="26" height="26" rx="5" fill="#141210"/><text x="0" y="6" text-anchor="middle" font-family="Oswald, Arial, sans-serif" font-weight="700" font-size="17" fill="#fffaf2">P</text></g>
    <!-- metro -->
    <g transform="translate(600 230)"><circle r="17" fill="#d9281c"/><text x="0" y="7" text-anchor="middle" font-family="Oswald, Arial, sans-serif" font-weight="700" font-size="20" fill="#fffaf2">M</text></g>
    <!-- restaurante -->
    <g transform="translate(210 178)">
      <path d="M0,18 C-16,-2 -22,-8 -22,-20 A22,22 0 1,1 22,-20 C22,-8 16,-2 0,18Z" fill="#d9281c"/>
      <circle cy="-20" r="9" fill="#fffaf2"/>
    </g>
  </g>
  <g transform="translate(116 252)">
    <rect x="0" y="-16" width="176" height="40" rx="20" fill="#141210"/>
    <text x="88" y="10" text-anchor="middle" font-family="Oswald, 'Arial Narrow', Arial, sans-serif" font-weight="600" font-size="14" letter-spacing="1.5" fill="#fffaf2">MUNTANER 22 · AQUÍ</text>
  </g>
  <text x="620" y="426" text-anchor="end" font-family="Figtree, Arial, sans-serif" font-size="11" fill="#1b211c" opacity=".55">Esquema, sin escala</text>
</svg>
